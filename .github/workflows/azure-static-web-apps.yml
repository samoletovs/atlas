name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build_and_deploy_job:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      # Build explicitly BEFORE handing off to Oryx. When Oryx runs the build
      # itself and `npm run build` fails, it does not fail the job — it falls
      # back to uploading the source directory, so the deploy reports success
      # while production silently serves an unbuilt index.html. That is exactly
      # how a tsc error shipped a broken site unnoticed. Building here makes a
      # broken build fail the workflow loudly, and `skip_app_build` stops Oryx
      # from rebuilding (and re-masking) it.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Verify build output
        run: |
          # A successful build must produce a real bundle, not the source
          # template. Fail here rather than deploying a broken site.
          test -f dist/index.html || { echo "::error::dist/index.html missing — build did not run"; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references /src/main.tsx — unbuilt source would be deployed"
            exit 1
          fi
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing — PWA build incomplete"; exit 1; }
          echo "build output verified"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "/"
          api_location: "api"
          output_location: "dist"

  e2e_smoke_test:
    if: github.event_name == 'push'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: E2E smoke test (production)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Wait for deployment to settle
        run: sleep 45
      - name: Run smoke tests against atlas.naurolabs.com
        env:
          ATLAS_BASE_URL: https://atlas.naurolabs.com
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  close_pull_request_job:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS }}
          action: "close"
          # app_location is unused by `action: close` but required by the
          # action's input schema (and by the VS Code Actions linter).
          app_location: "/"
