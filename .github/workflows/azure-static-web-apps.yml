name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build_and_deploy_job:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      # Build explicitly BEFORE handing off to Oryx. When Oryx runs the build
      # itself and `npm run build` fails, it does not fail the job — it falls
      # back to uploading the source directory, so the deploy reports success
      # while production silently serves an unbuilt index.html. That is exactly
      # how a tsc error shipped a broken site unnoticed. Building here makes a
      # broken build fail the workflow loudly, and `skip_app_build` stops Oryx
      # from rebuilding (and re-masking) it.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Verify build output
        run: |
          # A successful build must produce a real bundle, not the source
          # template. Fail here rather than deploying a broken site.
          test -f dist/index.html || { echo "::error::dist/index.html missing — build did not run"; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references /src/main.tsx — unbuilt source would be deployed"
            exit 1
          fi
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing — PWA build incomplete"; exit 1; }
          test -f dist/staticwebapp.config.json || { echo "::error::dist/staticwebapp.config.json missing — routes and auth rules would not deploy"; exit 1; }
          echo "build output verified"

      - name: Verify deployment token is configured
        # Azure/static-web-apps-deploy logs "Build will not be uploaded as
        # deployment_token was not found" and still exits 0 when this secret is
        # empty — that is exactly how run 8b88f86 reported success on 2026-08-17
        # while deploying nothing, masking the real last successful deployment.
        # Fail here instead of letting the deploy step silently no-op.
        env:
          AZURE_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS }}
        run: |
          if [ -z "$AZURE_SWA_TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS secret is empty — the deploy step would silently skip uploading while still reporting success. Failing the workflow instead of shipping a stale build unnoticed."
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # `app_location` is what gets zipped and uploaded, and with
          # `skip_app_build: true` no Oryx step narrows it to `output_location`.
          # Pointing it at "/" therefore shipped the whole workspace — 25,614
          # files and 212.7 MB of node_modules against the Free tier's 250 MB
          # ceiling — which is why deploys failed with "Failure during content
          # distribution" while the built site is only 0.33 MB. Upload `dist`.
          skip_app_build: true
          app_location: "dist"
          api_location: "api"
          output_location: ""

      - name: Verify deployment actually happened
        # Belt-and-suspenders for the same silent-skip failure mode: even with
        # a token present, the action only sets this output on a real deploy.
        # An empty output here means the step exited 0 without shipping anything.
        env:
          DEPLOYED_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "::error::Build And Deploy step produced no static_web_app_url output — it likely skipped uploading while still exiting 0. Treating this as a failed deploy rather than reporting green for nothing shipped."
            exit 1
          fi
          echo "Deployed to $DEPLOYED_URL"

  e2e_smoke_test:
    if: github.event_name == 'push'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: E2E smoke test (production)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Wait for deployment to settle
        run: sleep 45
      - name: Run smoke tests against atlas.naurolabs.com
        env:
          ATLAS_BASE_URL: https://atlas.naurolabs.com
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  close_pull_request_job:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ATLAS }}
          action: "close"
          # app_location is unused by `action: close` but required by the
          # action's input schema (and by the VS Code Actions linter).
          app_location: "/"
